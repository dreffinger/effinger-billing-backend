<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70d6f8"/><stop offset="1" stop-color="#f841e0"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/></pattern>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="224"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#082f35"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <circle cx="512" cy="470" r="330" fill="#0f4048"/>
  </g>
  <!-- the ehpa mark: healthcare-cross ring, open on the right -->
  <g filter="url(#glow)">
    <path d="M512 206 A264 264 0 1 1 325 283" fill="none" stroke="url(#g)" stroke-width="72" stroke-linecap="round"/>
    <path d="M512 336 V604 M378 470 H646" fill="none" stroke="url(#g)" stroke-width="72" stroke-linecap="round"/>
  </g>
  <!-- run badge -->
  <circle cx="790" cy="790" r="128" fill="#f841e0"/>
  <path d="M752 718 L868 790 L752 862 Z" fill="#082f35"/>
</svg>
